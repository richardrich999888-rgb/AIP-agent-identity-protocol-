name: AEGIS Quantum Validation

on:
  push:
    paths:
      - "aegis-quantum/**"
      - ".github/workflows/aegis-quantum.yml"
  pull_request:
    paths:
      - "aegis-quantum/**"
      - ".github/workflows/aegis-quantum.yml"
  workflow_dispatch:

jobs:
  lab-validation:
    name: Lab validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CI_GPG_PRIVATE_KEY_B64: ${{ secrets.CI_GPG_PRIVATE_KEY_B64 }}
    defaults:
      run:
        working-directory: aegis-quantum
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: rustup show

      - name: Cargo check, tests, and dry-run validation
        run: make ci-local

      - name: Generate validation report artifact
        run: make validation-report

      - name: Generate validation bundle manifest
        run: sha256sum validation_report.json > validation_bundle.sha256

      - name: Sign AEGIS validation bundle manifest with GPG
        if: env.CI_GPG_PRIVATE_KEY_B64 != ''
        run: |
          echo "$CI_GPG_PRIVATE_KEY_B64" | base64 -d | gpg --batch --import
          gpg --batch --yes --armor --detach-sign validation_bundle.sha256

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: aegis-validation-report
          path: |
            aegis-quantum/validation_report.json
            aegis-quantum/validation_bundle.sha256
          if-no-files-found: error

      - name: Upload AEGIS validation bundle signature
        if: env.CI_GPG_PRIVATE_KEY_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: aegis-validation-bundle-signature
          path: aegis-quantum/validation_bundle.sha256.asc
          if-no-files-found: error

      - name: Attest AEGIS validation bundle
        if: github.event_name != 'pull_request' && github.repository_visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            aegis-quantum/validation_report.json
            aegis-quantum/validation_bundle.sha256

  ebpf-build:
    name: eBPF bytecode build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CI_GPG_PRIVATE_KEY_B64: ${{ secrets.CI_GPG_PRIVATE_KEY_B64 }}
    defaults:
      run:
        working-directory: aegis-quantum
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libelf-dev

      - name: Install Rust nightly with rust-src
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Install bpf-linker
        run: cargo install bpf-linker --locked

      - name: Build eBPF bytecode
        run: make build-ebpf

      - name: Generate eBPF bytecode manifest
        run: sha256sum aegis-quantum-ebpf/target/bpfel-unknown-none/release/aegis-quantum-ebpf > ebpf_bytecode_bundle.sha256

      - name: Sign eBPF bytecode manifest with GPG
        if: env.CI_GPG_PRIVATE_KEY_B64 != ''
        run: |
          echo "$CI_GPG_PRIVATE_KEY_B64" | base64 -d | gpg --batch --import
          gpg --batch --yes --armor --detach-sign ebpf_bytecode_bundle.sha256

      - name: Upload eBPF bytecode
        uses: actions/upload-artifact@v4
        with:
          name: aegis-ebpf-bytecode
          path: |
            aegis-quantum/aegis-quantum-ebpf/target/bpfel-unknown-none/release/aegis-quantum-ebpf
            aegis-quantum/ebpf_bytecode_bundle.sha256
          if-no-files-found: error

      - name: Upload eBPF bytecode bundle signature
        if: env.CI_GPG_PRIVATE_KEY_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: aegis-ebpf-bytecode-signature
          path: aegis-quantum/ebpf_bytecode_bundle.sha256.asc
          if-no-files-found: error

      - name: Attest eBPF bytecode bundle
        if: github.event_name != 'pull_request' && github.repository_visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            aegis-quantum/aegis-quantum-ebpf/target/bpfel-unknown-none/release/aegis-quantum-ebpf
            aegis-quantum/ebpf_bytecode_bundle.sha256
