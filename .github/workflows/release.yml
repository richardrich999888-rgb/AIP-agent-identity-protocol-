name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (linux arm64)
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml

      - name: Build aip-service
        working-directory: aip-service
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build aip-verify
        working-directory: aip-standalone
        run: cargo build --release --target ${{ matrix.target }} -p aip-verify

      - name: Package artifacts
        run: |
          set -e
          OUT="dist/${{ matrix.target }}"
          mkdir -p "$OUT"
          cp "aip-service/target/${{ matrix.target }}/release/airon-aip" "$OUT/aip-service"
          cp "aip-standalone/target/${{ matrix.target }}/release/aip-verify" "$OUT/aip-verify"
          (cd "$OUT" && sha256sum aip-service aip-verify > SHA256SUMS)
          tar -C "$OUT" -czf "aip-${{ matrix.target }}.tar.gz" aip-service aip-verify SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: aip-${{ matrix.target }}
          path: aip-${{ matrix.target }}.tar.gz

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
