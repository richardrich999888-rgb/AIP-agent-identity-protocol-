name: CI

# The repository is a SINGLE Cargo workspace rooted at the repository root
# (see the top of ./Cargo.toml for why aip-standalone/ and aip-service/ were
# merged into one root). Every command below therefore runs from the root and
# addresses the whole workspace; the previous per-subdirectory `cd` steps were
# left over from the two-workspace layout and no longer have a manifest to run
# against.

on:
  pull_request:
  push:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  python-sdk:
    name: Python SDK regression and parity tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same signing backend pin as sdk/python/README.md.
      - run: python -m pip install cryptography==41.0.7
      - name: Test SDK, adapters, canonical fixtures and schemas
        env:
          PYTHONPATH: sdk/python
        run: python -m unittest discover -s sdk/python/tests -v

  quality:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # aip-hsm's tests run against SoftHSM2 through the same PKCS#11
      # interface a hardware module presents, and deliberately fail rather
      # than skip when it is absent: a custody test that passes without the
      # module has not run.
      - name: Install SoftHSM2 (PKCS#11 module for aip-hsm tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq softhsm2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # --all-features compiles the postgres code path too (tokio-postgres and
      # deadpool-postgres are pure Rust and build without a database). clippy
      # only compiles, so this widens coverage without needing a live DB.
      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Default features only. aip-service's `postgres` feature is exercised by
      # the postgres-backend job below against a live database; running it here
      # without one would be a false failure.
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --no-fail-fast

      - name: cargo test (release — perf gates)
        if: ${{ !cancelled() }}
        run: cargo test --workspace --release --no-fail-fast

  red-suite:
    name: RED suite (adversarial ledger reproducible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # Reproduces every ADVERSARIAL_RESULTS.md row that does not need kernel
      # capabilities the runner lacks; the kernel-gate rows report BLOCKED with
      # the reason, which is not a failure. A detection the ledger claims but
      # the code no longer delivers turns this job red.
      - name: RED suite
        run: validation/red_suite/run.sh

  postgres-backend:
    name: postgres backend integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aip
          POSTGRES_PASSWORD: aip
          POSTGRES_DB: aip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aip -d aip"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        # cwd selects aip-service as the current package; the workspace root is
        # still resolved from ./Cargo.toml.
        working-directory: aip-service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: clippy (postgres feature)
        run: cargo clippy --all-targets --features postgres -- -D warnings
      - name: test (postgres feature, live DB)
        if: ${{ !cancelled() }}
        env:
          AIP_TEST_DATABASE_URL: postgresql://aip:aip@127.0.0.1:5432/aip
        run: cargo test --features postgres --no-fail-fast

      # These tests are explicitly ignored in an ordinary cargo test run.
      # They provision restricted roles in a separate, disposable database.
      - name: storage controls (restricted roles, live DB)
        if: ${{ !cancelled() }}
        env:
          AIP_TEST_ADMIN_DATABASE_URL: postgresql://aip:aip@127.0.0.1:5432/aip
        run: cargo test --features postgres --test storage_controls -- --ignored

  supply-chain:
    name: cargo audit · cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit tools
        run: |
          cargo install cargo-audit --locked || true
          cargo install cargo-deny --locked || true
      # One workspace, one Cargo.lock at the root, one deny.toml at the root.
      # RUSTSEC-2026-0097 is assessed and ignored with justification in
      # ./deny.toml (rand::rng()+custom-logger unsoundness; AIP uses OsRng and
      # installs no custom logger).
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2026-0097
      - name: cargo deny check
        if: ${{ !cancelled() }}
        run: cargo deny check

  coverage:
    name: coverage (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore
