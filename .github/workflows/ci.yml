name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: fmt · clippy · test (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The repo has two independent Cargo workspaces.
        workspace: [aip-standalone, aip-service]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all --all-features

      - name: cargo test (release — perf gates)
        if: matrix.workspace == 'aip-standalone'
        run: cargo test --all --release

  postgres-backend:
    name: postgres backend integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aip
          POSTGRES_PASSWORD: aip
          POSTGRES_DB: aip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aip -d aip"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: aip-service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aip-service
      - name: clippy (postgres feature)
        run: cargo clippy --all-targets --features postgres -- -D warnings
      - name: test (postgres feature, live DB)
        env:
          AIP_TEST_DATABASE_URL: postgresql://aip:aip@127.0.0.1:5432/aip
        run: cargo test --features postgres

  supply-chain:
    name: cargo audit · cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit tools
        run: |
          cargo install cargo-audit --locked || true
          cargo install cargo-deny --locked || true
      - name: cargo audit (both workspaces)
        # RUSTSEC-2026-0097: see deny.toml justification (rand::rng()+custom
        # logger unsoundness; AIP uses OsRng with no custom logger).
        run: |
          set -e
          (cd aip-standalone && cargo audit --ignore RUSTSEC-2026-0097)
          (cd aip-service && cargo audit --ignore RUSTSEC-2026-0097)
      - name: cargo deny check
        run: |
          set -e
          (cd aip-standalone && cargo deny check) || exit 1
          (cd aip-service && cargo deny check) || exit 1

  coverage:
    name: coverage (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage (aip-standalone)
        working-directory: aip-standalone
        run: cargo llvm-cov --workspace --lcov --output-path ../lcov-standalone.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov-*.info
          if-no-files-found: ignore
