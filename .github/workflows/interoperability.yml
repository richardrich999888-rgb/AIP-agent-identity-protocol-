name: Interoperability contracts
on:
  pull_request:
    paths:
      - 'integrations/interoperability/**'
      - 'integrations/mcp-gateway/**'
      - 'aip-standalone/aip-airi/**'
      - 'validation/interoperability/**'
      - '.github/workflows/interoperability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - run: cargo test --locked -p aip-airi --example interop_verify
      - run: cargo build --locked -p aip-airi --example interop_verify
      - run: cargo build --locked -p aip-mcp-gateway --bin aip-tool-receipt
      - run: python3 validation/interoperability/test_offline_composition.py --verifier target/debug/examples/interop_verify
      - run: python3 validation/interoperability/verify_gateway_archive.py --archive validation/interoperability/results/20261028/combined/receipts.jsonl --anchor validation/interoperability/results/20261028/combined/trust-anchor.json --verifier target/debug/aip-tool-receipt
  python-policy-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.4
      - name: Locked adapter tests
        run: |
          uv sync --project integrations/interoperability --frozen --extra adk --extra test
          uv run --project integrations/interoperability --frozen --extra adk --extra test pytest integrations/interoperability/tests -q
      - name: Exact OPA release and live mTLS
        run: |
          mkdir -p /tmp/vanian-interop/bin
          curl -fL --retry 3 https://github.com/open-policy-agent/opa/releases/download/v1.21.4/opa_linux_amd64_static -o /tmp/vanian-interop/bin/opa
          echo '2ab571f367f293bb19523b76f92f1945bbf245003392c7f392903f95c2b9b630  /tmp/vanian-interop/bin/opa' | sha256sum -c -
          chmod 755 /tmp/vanian-interop/bin/opa
          /tmp/vanian-interop/bin/opa test integrations/interoperability/examples/policy -v
          uv run --project integrations/interoperability --frozen --extra adk --extra test python integrations/interoperability/examples/opa_live.py --opa /tmp/vanian-interop/bin/opa --output /tmp/vanian-interop/opa-results
      - name: Exact SPIRE release and genuine JWT-SVID
        run: |
          curl -fL --retry 3 https://github.com/spiffe/spire/releases/download/v1.15.3/spire-1.15.3-linux-amd64-musl.tar.gz -o /tmp/vanian-interop/spire.tar.gz
          echo 'ca1a4d1155317bdd2afc7f36663828a10410c7c840e54725b90b4064b0a301c7  /tmp/vanian-interop/spire.tar.gz' | sha256sum -c -
          tar -xzf /tmp/vanian-interop/spire.tar.gz -C /tmp/vanian-interop
          uv run --project integrations/interoperability --frozen --extra adk --extra test python integrations/interoperability/examples/spire_jwt_live.py --spire-directory /tmp/vanian-interop/spire-1.15.3 --output /tmp/vanian-interop/spire-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: interoperability-public-results
          path: |
            /tmp/vanian-interop/opa-results
            /tmp/vanian-interop/spire-results
          if-no-files-found: warn

