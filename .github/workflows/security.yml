name: Security

on:
  pull_request:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  cargo-audit:
    name: cargo audit (RUSTSEC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - name: Audit (fail on any vulnerability)
        # One workspace, one Cargo.lock at the repository root.
        # RUSTSEC-2026-0097 ignored with justification (see ./deny.toml): rand
        # unsoundness only via rand::rng()+custom logger; AIP uses OsRng only.
        run: cargo audit --ignore RUSTSEC-2026-0097 --json | tee audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-audit-report
          path: audit.json
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the exact historical checksum classifications
        run: python3 -B validation/p0_048/security_gate.py --verify-inputs
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2, same implementation as baseline
        env:
          # Required by gitleaks-action v2 to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fails the job if any secret is detected.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  trivy-fs:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable evidence and classification controls
        run: |
          python3 -B validation/p0_048/security_gate.py --verify-inputs
          python3 -B validation/p0_048/test_security_gate.py
      - name: Install checksum-pinned scanners
        run: |
          python3 -B validation/p0_048/install_security_scanners.py --prefix "$RUNNER_TEMP/p0-security-bin"
          echo "$RUNNER_TEMP/p0-security-bin" >> "$GITHUB_PATH"
      # Rust dependency vulnerabilities are owned by cargo-audit + cargo-deny
      # (above / in ci.yml). Trivy here covers secrets and IaC misconfiguration
      # (Dockerfile, compose) so coverage is complementary, not duplicated.
      - name: Scan all files and classify only immutable historical findings
        run: |
          set +e
          trivy fs --scanners secret,misconfig \
            --severity CRITICAL,HIGH --ignorefile '' --exit-code 42 \
            --format sarif --output "$RUNNER_TEMP/trivy-results.sarif" .
          scan_exit=$?
          set -e
          python3 -B validation/p0_048/security_gate.py \
            --report "$RUNNER_TEMP/trivy-results.sarif" --scan-exit "$scan_exit" \
            --output "$RUNNER_TEMP/security-classification.json"
      - name: Require real scanners to reject new secrets and copied unsafe manifests
        run: |
          python3 -B validation/p0_048/security_scanner_controls.py \
            --gitleaks "$RUNNER_TEMP/p0-security-bin/gitleaks" \
            --trivy "$RUNNER_TEMP/p0-security-bin/trivy" \
            --output "$RUNNER_TEMP/security-scanner-controls.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: |
            ${{ runner.temp }}/trivy-results.sarif
            ${{ runner.temp }}/security-classification.json
            ${{ runner.temp }}/security-scanner-controls.json
          if-no-files-found: error
