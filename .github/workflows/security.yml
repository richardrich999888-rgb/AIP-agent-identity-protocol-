name: Security

on:
  pull_request:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  scanner-controls:
    name: Scanner and Kubernetes security controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checksum-pinned regression tools
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/scanner-control-tools"
          mkdir -p "$tools_dir"
          cd "$tools_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 \
            -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz' | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 \
            -o helm.tar.gz https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz
          echo '3f43c0aa57243852dd542493a0f54f1396c0bc8ec7296bbb2c01e802010819ce  helm.tar.gz' | sha256sum --check -
          tar -xzf helm.tar.gz linux-amd64/helm
          echo "GITLEAKS=$tools_dir/gitleaks" >> "$GITHUB_ENV"
          echo "HELM=$tools_dir/linux-amd64/helm" >> "$GITHUB_ENV"
      - name: Exercise real secret detections and probe refusal
        run: python -B validation/security/test_scanner_controls.py

  cargo-audit:
    name: cargo audit (RUSTSEC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - name: Audit (fail on any vulnerability)
        # One workspace, one Cargo.lock at the repository root.
        # RUSTSEC-2026-0097 ignored with justification (see ./deny.toml): rand
        # unsoundness only via rand::rng()+custom logger; AIP uses OsRng only.
        run: cargo audit --ignore RUSTSEC-2026-0097 --json | tee audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-audit-report
          path: audit.json
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by gitleaks-action v2 to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fails the job if any secret is detected.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  trivy-fs:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install the trivy CLI directly (avoids action version-tag drift).
      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy --version
      # Rust dependency vulnerabilities are owned by cargo-audit + cargo-deny
      # (above / in ci.yml). Trivy here covers secrets and IaC misconfiguration
      # (Dockerfile, compose) so coverage is complementary, not duplicated.
      - name: Trivy filesystem scan (fail on CRITICAL/HIGH)
        run: |
          trivy fs --scanners secret,misconfig \
            --severity CRITICAL,HIGH --exit-code 1 \
            --format sarif --output trivy-results.sarif .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: ignore
