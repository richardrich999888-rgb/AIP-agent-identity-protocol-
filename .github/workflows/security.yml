name: Security

on:
  pull_request:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  cargo-audit:
    name: cargo audit (RUSTSEC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - name: Audit (fail on any vulnerability)
        # One workspace, one Cargo.lock at the repository root.
        # RUSTSEC-2026-0097 ignored with justification (see ./deny.toml): rand
        # unsoundness only via rand::rng()+custom logger; AIP uses OsRng only.
        run: cargo audit --ignore RUSTSEC-2026-0097 --json | tee audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-audit-report
          path: audit.json
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by gitleaks-action v2 to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fails the job if any secret is detected.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  trivy-fs:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install the trivy CLI directly (avoids action version-tag drift).
      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy --version
      # Rust dependency vulnerabilities are owned by cargo-audit + cargo-deny
      # (above / in ci.yml). Trivy here covers secrets and IaC misconfiguration
      # (Dockerfile, compose) so coverage is complementary, not duplicated.
      - name: Trivy filesystem scan (fail on CRITICAL/HIGH)
        run: |
          trivy fs --scanners secret,misconfig \
            --severity CRITICAL,HIGH --exit-code 1 \
            --format sarif --output trivy-results.sarif .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: ignore
