name: Security

on:
  pull_request:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  cargo-audit:
    name: cargo audit (RUSTSEC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - name: Audit (fail on any vulnerability)
        # One workspace, one Cargo.lock at the repository root.
        # RUSTSEC-2026-0097 ignored with justification (see ./deny.toml): rand
        # unsoundness only via rand::rng()+custom logger; AIP uses OsRng only.
        shell: bash
        run: cargo audit --ignore RUSTSEC-2026-0097 --json | tee audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-audit-report
          path: audit.json
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by gitleaks-action v2 to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fails the job if any secret is detected.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  trivy-fs:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scope: filesystem, label: trivy filesystem scan}
          - {scope: collector, label: trivy rendered collector}
          - {scope: host-probe, label: trivy rendered host probe}
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-pinned Trivy
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --silent --show-error -o trivy.tgz \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo 'bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  trivy.tgz' | sha256sum -c -
          mkdir -p vanian-scan-tools
          tar -xzf trivy.tgz -C vanian-scan-tools trivy
          echo "$RUNNER_TEMP/vanian-scan-tools" >> "$GITHUB_PATH"
      - name: Render the current Helm profile
        if: matrix.scope != 'filesystem'
        env:
          PROFILE: ${{ matrix.scope }}
        shell: bash
        run: |
          curl --fail --location --retry 3 --silent --show-error -o "$RUNNER_TEMP/helm.tgz" \
            https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz
          echo "3f43c0aa57243852dd542493a0f54f1396c0bc8ec7296bbb2c01e802010819ce  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" --strip-components=1 -C "$RUNNER_TEMP/vanian-scan-tools" linux-amd64/helm
          mkdir -p "$RUNNER_TEMP/manifests"
          bash validation/ci/render_kubernetes_profile.sh "$PROFILE" > "$RUNNER_TEMP/manifests/$PROFILE.yaml"
          test -s "$RUNNER_TEMP/manifests/$PROFILE.yaml"
      - name: Scan repository secrets and configuration
        if: matrix.scope == 'filesystem'
        run: |
          trivy fs --scanners secret,misconfig --severity CRITICAL,HIGH --exit-code 1 \
            --format sarif --output trivy-results.sarif .
      - name: Scan the rendered configuration
        if: matrix.scope != 'filesystem'
        run: |
          trivy config --severity CRITICAL,HIGH --exit-code 1 \
            --format sarif --output trivy-results.sarif "$RUNNER_TEMP/manifests"
      - name: Report Trivy rule locations
        if: always() && hashFiles('trivy-results.sarif') != ''
        shell: python
        run: |
          import json
          from pathlib import Path

          report = json.loads(Path("trivy-results.sarif").read_text())
          for run in report.get("runs", []):
              for result in run.get("results", []):
                  for location in result.get("locations", []):
                      physical = location.get("physicalLocation", {})
                      record = {
                          "rule": result.get("ruleId"),
                          "path": physical.get("artifactLocation", {}).get("uri"),
                          "line": physical.get("region", {}).get("startLine"),
                      }
                      print("Trivy finding " + json.dumps(record))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-${{ matrix.scope }}
          path: trivy-results.sarif
          if-no-files-found: ignore
