name: Enterprise integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'aip-service/**'
      - 'aip-standalone/aip-mcp-gateway/**'
      - 'deploy/enterprise/**'
      - 'deploy/sql/**'
      - 'sdk/**'
      - 'integrations/evidence-*/**'
      - 'integrations/enterprise-console/**'
      - 'integrations/mcp-gateway/**'
      - 'integrations/agents/**'
      - 'validation/enterprise/**'
      - '.github/workflows/enterprise-integration.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Pinned evidence client dependencies
        run: python -m pip install -r integrations/evidence-mcp/requirements.lock
      - name: Packaging and harness controls
        run: |
          python -B validation/enterprise/test_packaging.py
          python -B validation/enterprise/test_agent_harness.py
          python -B validation/enterprise/test_sql_provisioning.py
          python -B validation/rbi_demo/test_run.py
          bash -n integrations/agents/run.sh
          node --check integrations/enterprise-console/app.js
      - name: Clients and restricted MCP boundaries
        env:
          PYTHONPATH: sdk/python
        run: |
          python -m unittest discover -s sdk/python/tests -v
          python validation/enterprise/test_client_boundaries.py
          node --test sdk/typescript/test/client.test.ts
          npm exec --yes --package typescript@5.9.3 -- tsc --noEmit --target ES2022 --lib ES2022,DOM --module NodeNext --moduleResolution NodeNext --strict sdk/typescript/src/index.ts
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p airon-aip -p aip-mcp-gateway --all-targets --all-features -- -D warnings
          cargo test --locked -p airon-aip -p aip-mcp-gateway -p aip-airi -p aip-authorize -p aip-observe-verify -p aip-transport -p aip-collector
      - name: Real service, both SDKs, official MCP client and tenant isolation
        env:
          PYTHONPATH: ${{ github.workspace }}/sdk/python
          AIP_ENTERPRISE_CLIENT_SMOKE: ${{ github.workspace }}/validation/enterprise/client_smoke.py
        run: |
          export AIP_ENTERPRISE_PYTHON="$(command -v python)"
          cargo test --locked -p airon-aip --test enterprise_api real_http_clients_use_the_service_boundary -- --ignored --nocapture
          cargo test --locked -p airon-aip --test enterprise_api real_same_run_clients_use_the_service_boundary -- --ignored --nocapture
      - name: Build verifiable Linux package
        run: |
          cargo build --locked --release -p aip-probe --bin aip-probe -p aip-collector --bin aip-collector -p aip-observe-verify --bin aip-observe-verify
          python deploy/enterprise/linux/package.py build --bin-dir target/release --target x86_64-unknown-linux-gnu --source-commit "$(git rev-parse HEAD)" --output dist/vanian-runtime-x86_64-linux.tar
          sha256sum dist/vanian-runtime-x86_64-linux.tar > dist/SHA256SUMS
      - name: Actual Linux executable package install/uninstall/reinstall (staging only)
        run: |
          python validation/enterprise/package_lifecycle.py \
            --archive dist/vanian-runtime-x86_64-linux.tar \
            --expected-sha256 "$(cut -d ' ' -f 1 dist/SHA256SUMS)" \
            --output dist/package-lifecycle
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-linux-runtime-${{ github.sha }}
          path: dist/
          retention-days: 14
  contextforge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - name: Prepare actual pinned ContextForge
        run: |
          git clone https://github.com/IBM/mcp-context-forge.git "$RUNNER_TEMP/contextforge"
          git -C "$RUNNER_TEMP/contextforge" checkout ff6a566a4b5c098093db90bbb4d5df483e108026
          uv sync --project "$RUNNER_TEMP/contextforge" --locked --no-dev --no-install-project --python python3.12
          cargo build --locked -p aip-mcp-gateway --bin aip-tool-receipt --bin aip-execution-assurance --example contextforge_fixture
      - name: Actual gateway and upstream interoperability
        run: |
          "$RUNNER_TEMP/contextforge/.venv/bin/python" integrations/mcp-gateway/test_authorization_policy.py
          "$RUNNER_TEMP/contextforge/.venv/bin/python" integrations/mcp-gateway/validate_contextforge.py --contextforge-source "$RUNNER_TEMP/contextforge" --signer-binary target/debug/aip-tool-receipt --output "$RUNNER_TEMP/contextforge-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextforge-integration-${{ github.sha }}
          path: |
            ${{ runner.temp }}/contextforge-results/report.json
            ${{ runner.temp }}/contextforge-results/source-manifest.json
            ${{ runner.temp }}/contextforge-results/trust-anchor.json
            ${{ runner.temp }}/contextforge-results/receipts.jsonl
            ${{ runner.temp }}/contextforge-results/*-authorization.json
            ${{ runner.temp }}/contextforge-results/*-comparison.json
            ${{ runner.temp }}/contextforge-results/upstream-events.jsonl
          retention-days: 14
