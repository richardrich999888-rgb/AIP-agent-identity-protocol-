# Source: vanian-runtime/templates/runtime.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanian-runtime-collector
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: vanian-runtime-collector
  template:
    metadata:
      labels:
        app: vanian-runtime-collector
      annotations:
        vanian.example/validation: unvalidated-template
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        vanian.example/runtime-role: "vanian-independent-collector"
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: collector
          image: "registry.example.invalid/vanian/collector@sha256:1111111111111111111111111111111111111111111111111111111111111111"
          command: ["/usr/local/bin/aip-collector"]
          envFrom:
            - configMapRef:
                name: "collector-environment-fixture"
          env:
            - {name: AIP_COLLECTOR_LISTEN, value: "0.0.0.0:8443"}
            - {name: AIP_COLLECTOR_KEY_PATH, value: /var/lib/aip-collector/collector.key.wrapped}
            - {name: AIP_COLLECTOR_NOISE_KEY_PATH, value: /var/lib/aip-collector/noise.key.json}
            - {name: AIP_COLLECTOR_STATE_DIR, value: /var/lib/aip-collector/state}
            - {name: AIP_COLLECTOR_PROBES_PATH, value: /etc/aip/probes.json}
            - {name: AIP_COLLECTOR_PASSPHRASE_FILE, value: /run/secrets/collector-passphrase}
            - {name: AIP_COLLECTOR_CONTINUITY, value: strict}
            - {name: AIP_COLLECTOR_REQUIRE_SYNCED_CLOCK, value: "1"}
          ports: [{name: transport, containerPort: 8443}]
          # Listener reachability only, never signed coverage or evidence health.
          readinessProbe:
            tcpSocket: {port: transport}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: state, mountPath: /var/lib/aip-collector}
            - {name: passphrase, mountPath: /run/secrets, readOnly: true}
            - {name: probes, mountPath: /etc/aip, readOnly: true}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: vanian-runtime-collector-state
        - name: passphrase
          secret:
            secretName: "collector-passphrase-fixture"
            defaultMode: 0440
            items: [{key: collector-passphrase, path: collector-passphrase}]
        - name: probes
          configMap:
            name: "approved-probes-fixture"
