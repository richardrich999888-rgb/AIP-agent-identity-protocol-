apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vanian-runtime-collector-state
  annotations:
    # Removing software must not remove evidence or collector key material.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: "20Gi"
