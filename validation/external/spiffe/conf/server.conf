# NOTE: socket paths live under a SHORT runtime directory on purpose.
# A Unix domain socket path is limited to 108 bytes (sun_path). This
# repository's results directory produces paths of ~112 bytes, which made
# SPIRE's UDS listener fail; the endpoint errgroup then cancelled the TCP
# listener too, and the server logged NO error -- it simply started and
# stopped its APIs in the same second. Evidence still lands in the results
# directory; only the sockets and working data live under __RUN__.
# SPIRE server, standalone. No Kubernetes, no upstream CA: SPIRE mints its own
# CA so the whole trust domain is self-contained and disposable.
# Paths are rewritten by run.sh to the run's working directory.
server {
    bind_address = "127.0.0.1"
    bind_port    = "__PORT__"
    socket_path  = "__RUN__/server-api.sock"
    trust_domain = "aip.local"
    data_dir     = "__RUN__/server-data"
    log_level    = "INFO"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "__RUN__/server-data/datastore.sqlite3"
        }
    }

    # A node attestor that needs no cloud provider: the operator hands the
    # agent a single-use token. Sufficient for a single-host cross-check, and
    # deliberately the weakest link we are NOT making a claim about.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data = {}
    }
}
