# NOTE: socket paths live under a SHORT runtime directory on purpose.
# A Unix domain socket path is limited to 108 bytes (sun_path). This
# repository's results directory produces paths of ~112 bytes, which made
# SPIRE's UDS listener fail; the endpoint errgroup then cancelled the TCP
# listener too, and the server logged NO error -- it simply started and
# stopped its APIs in the same second. Evidence still lands in the results
# directory; only the sockets and working data live under __RUN__.
# SPIRE agent, standalone.
#
# The setting that matters for this whole exercise is
# `discover_workload_path = true` on the unix workload attestor. Without it the
# attestor produces only uid/gid selectors, and there is nothing about the
# workload's CODE for AIP to be compared against. With it, SPIRE reads
# /proc/<pid>/exe and offers a `unix:sha256` selector — the same quantity AIP
# measures independently, which is the join for the whole comparison.
agent {
    data_dir          = "__RUN__/agent-data"
    log_level         = "INFO"
    server_address    = "127.0.0.1"
    server_port       = "__PORT__"
    socket_path       = "__RUN__/agent-api.sock"
    trust_bundle_path = "__RUN__/bundle.crt"
    trust_domain      = "aip.local"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "disk" {
        plugin_data {
            directory = "__RUN__/agent-data"
        }
    }
    WorkloadAttestor "unix" {
        plugin_data {
            discover_workload_path = true
        }
    }
}
