# cargo-deny configuration (schema v2). Used by CI (.github/workflows/ci.yml).

[advisories]
# Fail the build on known security vulnerabilities.
yanked = "warn"
ignore = []

[licenses]
# Permissive licenses we accept for dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8
# Our own crates are proprietary/unpublished — do not license-check them.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
