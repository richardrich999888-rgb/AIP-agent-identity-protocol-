# Clock discipline for the AIP pilot hosts (matrix row E4).
#
# CERT-In Direction 20(3)/2022 requires that systems connect to NTP servers
# operated by NIC (National Informatics Centre) or NPL (National Physical
# Laboratory), or to servers traceable to them, and that the clocks stay
# synchronised. An entity may use its own internal NTP infrastructure
# provided it is itself traceable to those sources.
#
# This is a template, not a drop-in: confirm the current NIC/NPL hostnames
# against CERT-In's own published guidance before deploying, and prefer the
# institution's internal stratum-2 servers where it runs them. Install as
# /etc/chrony/chrony.conf (Debian) or /etc/chrony.conf (RHEL), then:
#
#   systemctl enable --now chronyd
#   chronyc tracking          # offset and stratum
#   chronyc sources -v        # which source is selected
#
# Why this matters here specifically: the COLLECTOR stamps and signs every
# attested batch. An undisciplined clock on that host does not produce one
# wrong timestamp -- it produces an archive that is wrong together and
# internally consistent, and nothing in the sealed bytes afterwards reveals
# it. `aip-collector` therefore refuses to start when the kernel reports its
# clock as unsynchronised or outside the configured error budget; see
# AIP_COLLECTOR_REQUIRE_SYNCED_CLOCK and AIP_COLLECTOR_CLOCK_MAX_ERROR_MS in
# collector.env.example.

# ── Time sources ──
# NIC and NPL public services. Replace or supplement with the institution's
# own traceable stratum-2 servers. `iburst` speeds the initial convergence
# so a rebooted host is disciplined in seconds rather than minutes.
server samay1.nic.in iburst
server samay2.nic.in iburst
server time.nplindia.org iburst

# Two independent sources minimum; three lets chrony out-vote a falseticker.
# `minsources 2` refuses to steer the clock on a single source's word.
minsources 2

# ── Drift and step behaviour ──
# Learn the local oscillator's drift so the clock stays close between polls.
driftfile /var/lib/chrony/chrony.drift

# Step (rather than slew) only during the first three updates after start,
# and only for offsets above one second. A running evidence collector must
# not have its clock jumped underneath it: after those first updates every
# correction is slewed, so timestamps stay monotonic.
makestep 1.0 3

# Record the real-time clock drift so a reboot starts closer to correct.
rtcsync

# ── Hygiene ──
# This host is a client, never a server: it answers no NTP queries.
port 0
cmdport 323

# Log enough to answer an auditor's "was the clock disciplined on that day".
# Retain alongside the other ICT logs under the 180-day CERT-In floor.
logdir /var/log/chrony
log tracking measurements statistics
