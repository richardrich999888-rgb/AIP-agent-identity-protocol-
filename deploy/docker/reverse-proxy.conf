# Reference reverse proxy for aip-service (R9b, matrix E6 / B1).
#
# The service speaks plain HTTP on a private network and enforces the limits
# it alone can see: request body size, per-request timeout, and a global
# in-flight cap (aip_service::ingress). This proxy enforces the limits that
# need the client's connection and address, which the service behind it does
# not have — every request reaches it from this proxy's address.
#
# This is a template, not a drop-in: fill in the server name, the certificate
# paths, and the upstream address, and review every number against the
# institution's own capacity. It is nginx syntax; the same controls exist in
# HAProxy, Envoy and a cloud load balancer, and the comments say what each
# one is for so it can be translated.
#
# What this file enforces, and why it is here and not in the service:
#   - TLS termination                    the service speaks plain HTTP
#   - per-client rate limiting           needs the real client IP
#   - slow-loris header/body timeouts    needs the raw connection
#   - a connection cap per client        per-connection, not per-request
#   - a coarse body-size ceiling         a cheap first cut before the app's

# ── Per-client rate limit ──
# One zone keyed by client address. 10 r/s with a burst of 20 is a starting
# point for a pilot; a production rate follows from measured probe and
# auditor traffic. `nodelay` serves the burst immediately, then throttles.
limit_req_zone $binary_remote_addr zone=aip_rl:10m rate=10r/s;
# At most 20 concurrent connections per client: a single host cannot hold
# the pool open.
limit_conn_zone $binary_remote_addr zone=aip_conn:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name aip.institution.example;   # ← set this

    # ── TLS ──
    # Terminated here; the service never sees a certificate. Use TLS 1.2+
    # only and a modern cipher list; pin these to the institution's policy.
    ssl_certificate     /etc/ssl/aip/fullchain.pem;   # ← set this
    ssl_certificate_key /etc/ssl/aip/privkey.pem;     # ← set this
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ── Rate and connection limits ──
    limit_req  zone=aip_rl burst=20 nodelay;
    limit_conn aip_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    # ── Slow-client timeouts (slow-loris) ──
    # A client that dribbles a request header or body byte by byte holds a
    # worker; these bound how long it may. The service's own per-request
    # timeout is a backstop for work that has already been admitted.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     30s;

    # ── Coarse body ceiling ──
    # A cheap reject at the edge, ahead of the service's own 1 MiB cap
    # (AIP_MAX_BODY_BYTES). Keep this at or just above the service's value;
    # the service remains the authority, because only it knows what a
    # legitimate packet costs to parse.
    client_max_body_size 1m;

    location / {
        proxy_pass http://aip-service:8081;   # ← the private upstream
        proxy_http_version 1.1;

        # Preserve the real client for the service's logs and for any
        # future in-app decision. Do not let a client forge these: the
        # proxy sets them, replacing whatever arrived.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upstream timeouts: bound a slow or stuck service so a proxy
        # worker is not pinned either.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # The metrics route is authenticated at the service, but there is no
    # reason to expose it to the public internet. Restrict it to the
    # monitoring network at the edge as defence in depth.
    location = /metrics {
        allow 10.0.0.0/8;    # ← the monitoring network
        deny  all;
        proxy_pass http://aip-service:8081;
        proxy_set_header Host $host;
    }
}

# Plain HTTP is redirected, never served.
server {
    listen 80;
    server_name aip.institution.example;   # ← set this
    return 308 https://$host$request_uri;
}
