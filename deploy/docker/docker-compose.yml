# AIP local/pilot deployment foundation.
#
#   docker compose -f deploy/docker/docker-compose.yml up --build
#
# aip-service uses PostgreSQL as the durable Evidence Vault backend
# (AIP_STORE_BACKEND=postgres). The schema is applied automatically on startup.
# To import an existing JSONL vault, run the bundled tool inside the container:
#   docker compose exec aip-service aip-migrate \
#     --source /var/lib/aip/evidence.jsonl --database-url "$DATABASE_URL"
#
# minio remains a placeholder for future evidence archival / export and is NOT
# yet used by the service.

services:
  aip-service:
    build:
      context: ../..                      # repo root (the single Cargo workspace)
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      AIP_PORT: "8081"
      AIP_KEY_PATH: /var/lib/aip/signing.key
      # Signing-key custody. The service refuses to start with an unwrapped
      # key unless AIP_CUSTODY_POLICY=development; compose therefore fails
      # fast here rather than letting the container exit(1) in a loop.
      AIP_KEY_PASSPHRASE: ${AIP_KEY_PASSPHRASE:?set AIP_KEY_PASSPHRASE to wrap the service signing key (or export AIP_CUSTODY_POLICY=development for a throwaway local trial and pass it through below)}
      AIP_CUSTODY_POLICY: ${AIP_CUSTODY_POLICY:-production}
      AIP_REVOCATION_LOG_PATH: /var/lib/aip/revocation.jsonl
      AIP_API_KEYS_PATH: /etc/aip/keys.json   # mount your keys file (see below)
      # Durable backend:
      AIP_STORE_BACKEND: postgres
      DATABASE_URL: postgresql://aip:${AIP_PG_PASSWORD:-change-me}@postgres:5432/aip
      # JSONL fallback path (used only if AIP_STORE_BACKEND=jsonl):
      AIP_VAULT_PATH: /var/lib/aip/evidence.jsonl
      # Ingress limits the service enforces itself (R9b). A malformed value
      # fails the start rather than disabling the control. Per-client rate
      # limiting and TLS are the proxy's job (reverse-proxy.conf).
      AIP_MAX_BODY_BYTES: "1048576"       # 1 MiB; a body above this is 413
      AIP_REQUEST_TIMEOUT_SECS: "30"      # a request past this is 408
      AIP_MAX_IN_FLIGHT: "256"            # global concurrent-request ceiling
      RUST_LOG: info
    volumes:
      - aip-data:/var/lib/aip
      - ./keys.json:/etc/aip/keys.json:ro     # provide an API keys file
    # TLS, per-client rate limiting and slow-loris timeouts terminate at an
    # ingress/proxy in front of this service (the service speaks plain HTTP
    # and enforces only the limits it alone can see — body size, per-request
    # timeout, global concurrency). deploy/docker/reverse-proxy.conf is the
    # reference. Do not expose port 8081 directly to the internet.
    restart: unless-stopped

  # ── Durable Evidence Vault backend (primary store) ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aip
      POSTGRES_PASSWORD: ${AIP_PG_PASSWORD:-change-me}
      POSTGRES_DB: aip
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aip -d aip"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Placeholder object storage for evidence archival / exports ──
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AIP_MINIO_USER:-aip}
      MINIO_ROOT_PASSWORD: ${AIP_MINIO_PASSWORD:-change-me-please}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  aip-data:
  pg-data:
  minio-data:

# Environment variables (aip-service):
#   AIP_PORT                  listen port (default 8081)
#   AIP_KEY_PATH              service Ed25519 signing seed path
#   AIP_VAULT_PATH            Evidence Vault JSONL path (system of record)
#   AIP_KEY_PASSPHRASE        REQUIRED: wraps the signing key at rest
#   AIP_CUSTODY_POLICY        "production" (default) | "development"
#   AIP_REVOCATION_LOG_PATH   tenant-scoped revocation log path
#   AIP_API_KEYS_PATH         JSON: {"keys":[{key_id,tenant_id,role,secret_sha256}]}
#                             (no keys => fail closed: authed routes return 401)
#   AIP_STORE_BACKEND         "postgres" | "jsonl" (default jsonl)
#   DATABASE_URL              PostgreSQL DSN (required when backend=postgres)
#   AIP_MAX_BODY_BYTES        max request body in bytes (default 1048576) — R9b
#   AIP_REQUEST_TIMEOUT_SECS  per-request timeout in seconds (default 30) — R9b
#   AIP_MAX_IN_FLIGHT         global concurrent-request cap (default 256) — R9b
#   RUST_LOG                  log filter (default info)
