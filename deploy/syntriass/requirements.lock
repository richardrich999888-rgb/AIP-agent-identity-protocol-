# Pinned Python environment for the SYNTRIASS sidecar and harness.
#
# Installed by deploy/syntriass/setup_env.sh, which prefers a local wheel
# directory inside the offline bundle and falls back to PyPI only when that
# directory is absent.
#
# Derived, not transcribed: every version and hash below was read from wheels
# actually downloaded for CPython 3.11 on x86-64, which is what `python3`
# resolves to on the install target. `pip install --require-hashes` refuses the
# set if any file differs.
#
# Direct requirements and why:
#   numpy          interpretation sidecar and harness (research/system-one)
#   scikit-learn   QuantityClassifier('tfidf') via methods/extractors.py:102,105 — lazy import, so its absence shows up only at sidecar startup
#   pytest         the harness test suites under research/*/tests
#
# Deliberately ABSENT:
#   fastembed    methods/extractors.py:96 imports it only inside _embedder(),
#                which serves the 'embed' mode. The sidecar uses the 'tfidf'
#                mode, and fastembed would fetch BAAI/bge-small-en-v1.5 from
#                Hugging Face at first use — a network call, so it cannot be
#                part of an offline path. If the embed mode is ever needed
#                offline, its model has to be bundled and pinned like the GGUFs.
#
# Platform: the three compiled wheels below are cp311 manylinux x86-64. On a
# different interpreter or architecture setup_env.sh will fail the hash check
# rather than silently install something else; regenerate the lock there.

