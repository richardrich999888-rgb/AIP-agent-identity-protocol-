# Pinned Python environment for the SYNTRIASS sidecar, harness and ingestion.
#
# Installed by deploy/syntriass/setup_env.sh into a virtual environment. It
# prefers a wheel directory inside the offline bundle and falls back to PyPI
# only when that directory is absent.
#
# Derived, not transcribed: every version and hash below was read from wheels
# actually downloaded for CPython 3.11 on x86-64, which is what the venv's
# interpreter is on the install target. `pip install --require-hashes` refuses
# the whole set if any file differs.
#
# Direct requirements, why, and the licence as its own metadata states it:
#   numpy          [BSD-3-Clause]
#                  interpretation sidecar and harness (research/system-one)
#   scikit-learn   [BSD-3-Clause]
#                  QuantityClassifier('tfidf') via methods/extractors.py:102,105 - lazy import, so its absence shows up only at sidecar startup
#   pytest         [MIT]
#                  the harness test suites under research/*/tests
#   pypdf          [BSD-3-Clause (PyPI metadata)]
#                  PDF text and page numbers for document ingestion (BSD-3-Clause)
#   python-docx    [MIT (PyPI classifier)]
#                  DOCX paragraph and table text for document ingestion (MIT)
#   pillow         [MIT-CMU (PyPI metadata)]
#                  renders the synthetic scanned page in the ingestion test fixture (MIT-CMU)
#
# Deliberately ABSENT, each for a stated reason:
#   fastembed    methods/extractors.py:96 imports it only inside _embedder(),
#                which serves the 'embed' mode. The sidecar uses 'tfidf', and
#                fastembed would fetch BAAI/bge-small-en-v1.5 from Hugging Face
#                at first use - a network call, so it cannot be part of an
#                offline path.
#   pdfplumber   richer PDF tables, but it pulls pdfminer.six, which pulls
#                `cryptography`. pypdf gives the page text and page numbers the
#                ingestion contract needs with one transitive dependency. If
#                structured table reconstruction is ever required, weigh that
#                chain then rather than carrying it now.
#   pytesseract  a subprocess wrapper around the tesseract binary. Ingestion
#                already shells out to pdftoppm, so the wrapper adds a
#                dependency and no capability.
#
# SYSTEM packages, not installable from this file. An air-gapped bundle must
# carry their .deb files; `apt-get` is not available on the target host:
#   poppler-utils    pdftoppm, to rasterise a page for OCR
#   tesseract-ocr    the OCR engine itself (Apache-2.0)
#   tesseract-ocr-eng  English traineddata
#
# Platform: the compiled wheels below are cp311 manylinux x86-64. On a
# different interpreter or architecture setup_env.sh fails the hash check by
# design; regenerate the lock there rather than relaxing it.

