# Gitleaks configuration — extends the default ruleset.
#
# The only globally allowlisted path is the documented example key file used by the
# Docker deployment guide. It contains SHA-256 *hashes* of sample API keys
# (the service stores only hashes; see aip-service/src/auth.rs), not secrets.
# Real key files are gitignored (deploy/docker/keys.json).

[extend]
useDefault = true

[allowlist]
description = "Documented example/sample files containing no real secrets"
paths = [
  '''deploy/docker/keys\.example\.json$''',
]

# Only the generic heuristic is refined; provider-specific rules remain active.
# Exact historical nonsecret matches require BOTH the exact file and exact
# field/value. Other credentials on the same line and all future values are scanned.
# Historical bytes are unchanged. Positive detection controls run in Security CI.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Verified nonsecret byte_verified_public_sha256; exact retained evidence only"
condition = "AND"
regexTarget = "match"
paths = [
    '''^\Qexamples/local-evidence-agent/results/linux-observation/41507100812/public/source-hashes.json\E$''',
]
regexes = [
    '''^\Qapi_runtime.py": "2cbae701ac39983a86af0d088799378fbbdedc0b3f87cf47777ae166e6216219"\E$''',
]

[[rules.allowlists]]
description = "Verified nonsecret byte_verified_public_sha256; exact retained evidence only"
condition = "AND"
regexTarget = "match"
paths = [
    '''^\Qexamples/local-evidence-agent/results/linux-observation/41507100812/trust/controller-trust.json\E$''',
]
regexes = [
