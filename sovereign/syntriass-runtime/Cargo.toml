[package]
name = "syntriass-runtime"
description = "Integrated private intelligence runtime: adaptive strategy selection, scoped inference cache, and validated experience-derived capabilities over the VANIAN Sovereign slice and AIP. Ownership of reused code is as recorded in the repository; this crate name does not change it."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
vanian-sovereign = { path = "../vanian-sovereign" }
aip-types = { path = "../../aip-standalone/aip-types" }
aip-crypto = { path = "../../aip-standalone/aip-crypto" }
aip-core = { path = "../../aip-standalone/aip-core" }
aip-authorize = { path = "../../aip-standalone/aip-authorize" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
# Streaming SHA-256 for multi-GB model files (same version aip-crypto uses).
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "syntriass"
path = "src/bin/syntriass.rs"
