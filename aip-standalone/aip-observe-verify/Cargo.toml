[package]
name = "aip-observe-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline verifier for the observer's attested-batch and signed-health archives — the auditor's side of the Phase 1 exit gate"

[[bin]]
name = "aip-observe-verify"
path = "src/main.rs"

[dependencies]
aip-observe = { path = "../aip-observe" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
