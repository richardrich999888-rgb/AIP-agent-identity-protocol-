[package]
name = "aip-uas"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UAS accountability profile: a vertical profile over the generic accountability core, adding no identity, no verdict and no evidence hierarchy"

# ── A profile, not a security core ────────────────────────────────────────
#
# Every dependency here is consumed and none is extended. This crate defines
# no identifier (SystemId, PlatformId, HardwareId and MissionId already exist),
# no observation record, no verdict class and no evidence strength. It reaches
# `aip-reconcile` and `aip-nexora` only in dev-dependencies, and only to prove
# that driving them requires no change to either.
#
# The direction is one-way by construction: nothing in the verdict path
# depends on this crate, so a vertical profile cannot cause a semantic
# regression in the core. That is design decision D17-6, applied to the first
# vertical.
[dependencies]
aip-types = { path = "../aip-types" }
aip-crypto = { path = "../aip-crypto" }
aip-system = { path = "../aip-system" }
aip-execution = { path = "../aip-execution" }
aip-platform = { path = "../aip-platform" }
aip-observation = { path = "../aip-observation" }
aip-observe = { path = "../aip-observe" }
aip-effect = { path = "../aip-effect" }
aip-authorize = { path = "../aip-authorize" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
aip-core = { path = "../aip-core" }
# The reconciler and NEXORA are driven in tests to demonstrate that the UAS
# profile needs no change to either. They are deliberately NOT runtime
# dependencies: a profile that could reach the verdict engine at runtime is a
# profile that could eventually produce a verdict.
aip-reconcile = { path = "../aip-reconcile" }
aip-nexora = { path = "../aip-nexora" }
# The Skill 22 reference, driven as a UAS companion computer. This is how the
# profile's one reachable observation path is exercised against real kernel
# evidence rather than against a fixture.
aip-edge = { path = "../aip-edge" }
