[package]
name = "aip-reconcile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ghost Stage 4: reconcile ExpectedExecution against attested observation; CANNOT_PROVE by default"

[features]
# NOT PRODUCTION. Exposes `Reconciliation::fixture_default` so downstream
# test suites can build records the engine cannot currently reach. Switched
# on only in dev-dependencies; no production build enables it.
test-fixtures = []

[dependencies]
aip-types = { path = "../aip-types" }
aip-crypto = { path = "../aip-crypto" }
aip-authorize = { path = "../aip-authorize" }
aip-observe = { path = "../aip-observe" }
aip-core = { path = "../aip-core" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
