[package]
name = "aip-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Verifier-supplied platform and hardware binding for observed executions"

# One direction only, as with aip-system and aip-execution. Nothing in the
# verdict path depends on this crate and it depends on none of them: the
# registry is a verifier input, not a participant in any decision.
[dependencies]
aip-types = { path = "../aip-types" }
aip-crypto = { path = "../aip-crypto" }
aip-system = { path = "../aip-system" }
# Runtime, and load-bearing: an `ObservedBoot` can only be constructed from an
# attested batch this crate has verified against the verifier's own anchors.
# Without it the boot id would be bare bytes and a caller could pass a
# self-reported one, which is precisely the failure this skill must prevent.
# Not a verdict dependency: aip-observe is the observation layer, and
# aip-reconcile already depends on it.
aip-observe = { path = "../aip-observe" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
# The T13 tests drive the real decision point, the real observer and the real
# reconciler, rather than asserting the boundary in prose.
aip-authorize = { path = "../aip-authorize" }
aip-core = { path = "../aip-core" }
aip-reconcile = { path = "../aip-reconcile" }
