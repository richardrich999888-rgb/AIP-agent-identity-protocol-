# cargo-deny configuration. Used by CI (.github/workflows/ci.yml).

[advisories]
# Fail on security vulnerabilities (default). Warn on yanked crates.
yanked = "warn"
# RUSTSEC advisories explicitly assessed and accepted, with justification:
ignore = [
    # Unsound only when calling `rand::rng()` together with a custom logger.
    # AIP uses `rand::rngs::OsRng` for key/nonce generation and installs no
    # custom logger, so the unsound condition cannot occur. Re-evaluate on the
    # planned rand 0.9 upgrade.
    "RUSTSEC-2026-0097",
]

[licenses]
# Our own crates are proprietary (LicenseRef-Proprietary); deps must be
# permissive OSI licenses.
allow = [
    "LicenseRef-Proprietary",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
# Do not warn when an allowed license isn't present in the tree.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
