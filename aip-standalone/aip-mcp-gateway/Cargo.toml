[package]
name = "aip-mcp-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP tool-boundary gateway (R4/B10): countersigns every tools/call with a ToolReceipt over the canonical body arguments, using the gateway's own key"

[[bin]]
name = "aip-mcp-gateway"
path = "src/bin/aip-mcp-gateway.rs"

[[bin]]
name = "aip-tool-receipt"
path = "src/bin/aip-tool-receipt.rs"

[[bin]]
name = "aip-execution-assurance"
path = "src/bin/aip-execution-assurance.rs"

[dependencies]
aip-airi = { path = "../aip-airi" }
aip-authorize = { path = "../aip-authorize" }
aip-core = { path = "../aip-core" }
aip-observe = { path = "../aip-observe" }
aip-observe-verify = { path = "../aip-observe-verify" }
aip-reconcile = { path = "../aip-reconcile" }
hex = "0.4"
aip-crypto = { path = "../aip-crypto" }
aip-types = { path = "../aip-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
aip-authorize = { path = "../aip-authorize" }
