[package]
name = "aip-mcp-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP tool-boundary gateway (R4/B10): countersigns every tools/call with a ToolReceipt over the canonical body arguments, using the gateway's own key"

[[bin]]
name = "aip-mcp-gateway"
path = "src/bin/aip-mcp-gateway.rs"

[dependencies]
aip-airi = { path = "../aip-airi" }
aip-authorize = { path = "../aip-authorize" }
aip-crypto = { path = "../aip-crypto" }
aip-types = { path = "../aip-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
aip-authorize = { path = "../aip-authorize" }
