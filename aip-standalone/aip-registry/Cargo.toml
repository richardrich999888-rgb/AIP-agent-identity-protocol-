[package]
name = "aip-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Signed, versioned registry of an institution's named network resources; resolves observed endpoints to resource names deterministically, with 'unregistered' as an explicit outcome"

[dependencies]
aip-types = { path = "../aip-types" }
aip-crypto = { path = "../aip-crypto" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
