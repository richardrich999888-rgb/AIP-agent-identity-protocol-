[package]
name = "aip-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EvidencePacket, verification engine, and accountability graph — the AIP accountability layer"

[dependencies]
aip-types = { path = "../aip-types" }
aip-crypto = { path = "../aip-crypto" }
aip-core = { path = "../aip-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
# Audit-export bundle packaging (deflate only — no extra codecs needed).
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
rand = "0.8"
