[package]
name = "airon-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal verifier for AIRON EvidencePacket non-repudiation chains"

[[bin]]
name = "airon-verify"
path = "src/main.rs"

[dependencies]
aip-protocol = { path = "../aip-protocol" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
