[package]
name = "aip-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cryptographic operations for AIP: Ed25519, SHA-256, Base58, AIP-ID derivation"

[dependencies]
aip-types = { path = "../aip-types" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
bs58 = "0.5"
# Phase A key custody. Argon2id is memory-hard so a stolen wrapped file
# does not fall to a fast dictionary attack; XChaCha20-Poly1305 has a
# 24-byte nonce, large enough that a random one per write needs no counter
# to stay safe. zeroize wipes decrypted material on drop.
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1.8"
# FIPS-204 ML-DSA-65, for the hybrid signature path only. RustCrypto, the same
# ecosystem as ed25519-dalek. Pinned exactly; see src/hybrid.rs for the
# maturity disclosure this dependency obliges.
ml-dsa = "=0.1.1"
