[package]
name = "aip-execution"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Environment-neutral autonomous execution model: stage boundaries, runtime ladder and the external-effect boundary"

# One direction only. Nothing in the verdict path — reconcile, warrant,
# containment, nexora — depends on this crate, and it depends on none of them.
# This model produces no verdict; it produces inputs to the one that does.
[dependencies]
aip-types = { path = "../aip-types" }
aip-crypto = { path = "../aip-crypto" }
aip-system = { path = "../aip-system" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
# The binding test builds a real ExpectedExecution through a real decision
# point, rather than asserting the binding works in prose.
aip-authorize = { path = "../aip-authorize" }
aip-core = { path = "../aip-core" }
