[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanian-sdk"
version = "0.1.0"
description = "VANIAN AIRI accountability SDK and read-only evidence service client"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.7",
]

[tool.setuptools.packages.find]
include = [
    "vanian",
    "vanian.*",
    "vanian_airi",
    "vanian_airi.*",
]
