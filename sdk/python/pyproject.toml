[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanian-sdk"
version = "0.1.0"
description = "VANIAN evidence service and administrator configuration client"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["vanian", "vanian.*"]
