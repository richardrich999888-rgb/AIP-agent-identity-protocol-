[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airon-aip"
version = "0.1.0"
description = "Python SDK for AIRON Agent Identity Protocol persistent agent identity."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "AIRON" }
]
keywords = ["agent-identity", "ai-agents", "langchain", "provenance", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
numpy = ["numpy>=1.24"]
pandas = ["pandas>=2.0"]
torch = ["torch>=2.0"]
all = [
  "langchain-core>=0.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/richardrich999888-rgb/AIP-agent-identity-protocol-"
Repository = "https://github.com/richardrich999888-rgb/AIP-agent-identity-protocol-"

[tool.setuptools.packages.find]
where = ["src"]
