[package]
name = "ot-accountability-core"
description = "Deterministic canonical serialization, hash chaining, Merkle roots, and the typestate NEXORA lifecycle — one core shared by the native verifier CLI and the browser (via WASM)"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# rlib for native consumers (ot-verifier); cdylib for the wasm32 build the
# browser loads through wasm-bindgen.
crate-type = ["cdylib", "rlib"]

[features]
# Browser bindings. Native builds stay free of wasm-bindgen entirely.
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
