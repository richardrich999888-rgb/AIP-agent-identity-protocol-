# Repository-root workspace.
#
# # Why this exists (AUDIT B-10)
#
# `aip-standalone` and `aip-service` were two independent Cargo roots. The
# consequence was not theoretical: the six-branch forensic audit found that
# the verifier-time bound added to `aip-protocol` never reached the service,
# because `cargo test --workspace` in `aip-standalone` does not compile
# `aip-service` — so nothing failed when the service did not adopt it. That
# is finding B-1a, and B-10 is its cause.
#
# One workspace makes the primary build command span the protocol and the
# tier that serves it. A protocol change that breaks a service caller is now
# a compile error in the same command that developers already run.
#
# Members are listed explicitly rather than globbed: a new crate should be an
# intentional entry in this file, not something that appears by directory.
#
# # `aip-standalone/Cargo.toml` is gone, deliberately
#
# It was the previous workspace root. Cargo requires every member to sit
# hierarchically below its workspace root, and `aip-service` is a sibling of
# `aip-standalone`, so the root had to move up rather than that file gaining
# an out-of-tree member. Leaving a stub `[workspace]` behind does not work:
# an empty workspace table makes that directory a root again, with zero
# members, and every crate under it then fails to resolve
# `workspace.package`. There is now exactly one workspace root and one
# `Cargo.lock` in this repository; the old `aip-standalone/Cargo.lock` was
# removed with it, because a second lockfile that nothing reads is a trap for
# whoever next tries to reproduce a build from it.
[workspace]
resolver = "2"
members = [
    # ── accountability core ────────────────────────────────────────────
    "aip-standalone/aip-types",
    "aip-standalone/aip-crypto",
    "aip-standalone/aip-core",
    "aip-standalone/aip-protocol",
    "aip-standalone/aip-authorize",
    "aip-standalone/aip-registry",
    "aip-standalone/aip-ledger",
    # The incident evidence bundle (R14): assembles signed documents for an
    # agent and window and states the coverage it does not have.
    "aip-standalone/aip-incident",
    "aip-standalone/aip-observe",
    "aip-standalone/aip-airi",
    "aip-standalone/aip-system",
    "aip-standalone/aip-execution",
    "aip-standalone/aip-platform",
    "aip-standalone/aip-observation",
    "aip-standalone/aip-effect",
    "aip-standalone/aip-reconcile",
    "aip-standalone/aip-corroborate",
    "aip-standalone/aip-spiffe",
    "aip-standalone/aip-agent",
    "aip-standalone/aip-warrant",
    "aip-standalone/aip-nexora",
    # The external witness (R11): countersigns NEXORA heads with a key the
    # log operator does not hold, so a rewritten log cannot reproduce the
    # receipts a reviewer already has.
    "aip-standalone/aip-anchor",
    # SIEM export (R15): CEF over RFC 5424, formatting only, emitted from a
    # verified verdict and never from an unverified one.
    "aip-standalone/aip-siem",
    # PKCS#11 custody (R16): the signing key is generated inside the module
    # and never leaves it. Tested against SoftHSM2 in CI.
    "aip-standalone/aip-hsm",
    "aip-standalone/aip-containment",
    # ── the Linux autonomous edge reference (Skill 22) ─────────────────
    # Four members, and the split is the deliverable: the workload cannot
    # link the observer's crate and the observer cannot link the workload's.
    "aip-standalone/aip-edge-contract",
    "aip-standalone/aip-edge-workload",
    "aip-standalone/aip-edge-observer",
    "aip-standalone/aip-edge",
    # ── two-host pilot deployment (Phase 1) ────────────────────────────
    # The authenticated probe<->collector channel and the two daemons. The
    # probe holds no evidence key; the collector holds the only (wrapped) one.
    "aip-standalone/aip-transport",
    "aip-standalone/aip-collector",
    "aip-standalone/aip-probe",
    # ── vertical profiles over the generic core (Skills 23+) ───────────
    # A profile consumes the core and is consumed by nothing in it: the
    # dependency points one way, so a vertical cannot cause a semantic
    # regression in the accountability model it specialises.
    "aip-standalone/aip-uas",
    "aip-standalone/aip-robotics",
    "aip-standalone/aip-industrial",
    "aip-standalone/aip-space",
    "aip-standalone/aip-enterprise",
    # ── the conformance program over all of them (Skill 28) ───────────
    # Last in the order: it consumes every layer and nothing consumes it.
    "aip-standalone/aip-conformance",
    # ── Sniffer Dog 3.0: the two tiers that are not observation (ADR-015) ──
    # `aip-enforce` decides syscalls under a signed capability epoch;
    # `aip-interlock` is the dead-man heartbeat and the actuator watchdog.
    # Neither may depend on the observation or reconciliation path, and each
    # carries a test that reads its own manifest to keep it that way.
    "aip-standalone/aip-enforce",
    "aip-standalone/aip-interlock",
    # Shown-versus-authorized: the only workload-directed divergence class in
    # the system whose basis is arithmetic over two signed artifacts rather
    # than content read from the observed host (ADR-016).
    "aip-standalone/aip-approval",
    # ── tooling, demos and test harnesses ──────────────────────────────
    "aip-standalone/ghost-demo",
    "aip-standalone/aip-test",
    "aip-standalone/aip-cli",
    "aip-standalone/aip-verify",
    # The MCP tool boundary (R4/B10): a gateway that countersigns every
    # tools/call with a ToolReceipt over the canonical body arguments, so a
    # mis-parameterised call is caught against the receipt and not the agent's
    # own account of what it asked for.
    "aip-standalone/aip-mcp-gateway",
    # The auditor's verifier for the OBSERVER archives (attested batches
    # and signed health). `aip-verify` covers EvidencePackets; nothing
    # covered the observer chain, so the Phase 1 exit gate's "the verifier
    # accepts it offline" had no verifier an outside party could run.
    "aip-standalone/aip-observe-verify",
    "aip-standalone/aip-real-tests",
    "aip-standalone/banking_demo",
    # ── the HTTP service tier (B-10) ───────────────────────────────────
    "aip-service",
    # ── the OrbitalTrust import (audited; two of its four crates wired) ──
    # `ot-sentinel` is the reason this is here: everything else in this
    # repository is inline — it proves what went through the funnel and has
    # no answer for an agent that declines to use the funnel at all. The
    # sentinel reconciles what independent sensors saw against what the
    # ledger sealed, so a call that bypassed the channel has no packet to
    # account for it.
    #
    # `ot-mcp-gateway` and `ot-verifier` are NOT members: both need `ot-pqc`,
    # which the import did not include. See
    # orbitaltrust-accountability/README.md for the full state, including the
    # chain-format incompatibility that is still an open decision.
    "orbitaltrust-accountability/rust/ot-accountability-core",
    "orbitaltrust-accountability/rust/ot-sentinel",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
# Proprietary; "UNLICENSED" is not a valid SPDX expression (cargo-deny rejects it).
license = "LicenseRef-Proprietary"
